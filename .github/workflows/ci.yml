# .github/workflows/ci.yml
# ---------------------------------------------------------------------------
# Continuous integration: typecheck + lint + SGPC data validation + Gurbani validation + Playwright.
#
# - Triggers on pushes and pull requests to any branch.
# - `validate:sgpc` guards the no-code-change calendar release workflow: a
#   malformed `public/data/sgpc-<year>.json` fails the run before merge.
# - `validate:gurbani` guards scripture data integrity: missing Punjabi
#   translations from BaniDB fail the run before merge.
# - The Playwright suite serves `npm run dev` itself (see playwright.config.ts)
#   and needs live BaniDB/SGPC access; specs are written with fallbacks so one
#   slow upstream response retries once instead of failing the build.

name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate SGPC calendars
        run: npm run validate:sgpc

      - name: Validate Gurbani data
        run: npm run validate:gurbani

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test
