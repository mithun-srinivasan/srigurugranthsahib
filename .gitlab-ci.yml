# .gitlab-ci.yml
# ---------------------------------------------------------------------------
# GitLab CI: typecheck + lint + SGPC validation + Gurbani validation + Playwright
#
# Mirrors .github/workflows/ci.yml to ensure continuous integration on GitLab.

stages:
  - test

default:
  image: node:22-bookworm

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

verify:
  stage: test
  timeout: 30m
  before_script:
    - npm ci
  script:
    - npm run typecheck
    - npm run lint
    - npm run validate:sgpc
    - npm run validate:gurbani
    - npx playwright install --with-deps chromium
    - npm run test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
